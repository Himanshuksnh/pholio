<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />

    <!-- Base metadata. Per-route title/description/OG tags are managed by
         src/hooks/useDocumentMeta.ts -->
    <title>Pholio — Software Development Studio</title>
    <meta
      name="description"
      content="A software development studio designing and engineering web, mobile and custom software — from first sketch to production."
    />
    <meta name="author" content="Pholio" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pholio" />
    <meta property="og:title" content="Pholio — Software Development Studio" />
    <meta
      property="og:description"
      content="A software development studio designing and engineering web, mobile and custom software — from first sketch to production."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="en" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pholio — Software Development Studio" />
    <meta
      name="twitter:description"
      content="A software development studio designing and engineering web, mobile and custom software — from first sketch to production."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Fonts: preconnect first so the handshake starts before CSS resolves -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@100..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 40rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font-family: system-ui, sans-serif;
          color: #dde1e9;
        "
      >
        <h1 style="font-size: 1.5rem; margin: 0 0 1rem">Pholio — Software Development Studio</h1>
        <p style="line-height: 1.7; color: #98a0b1">
          This site needs JavaScript enabled to run. If you would rather not enable it, email us
          directly at <a style="color: #9db6ff" href="mailto:hello@pholio.studio">hello@pholio.studio</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
